name: Pixster Client CI

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'components.json'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.prettierignore'
      - 'vercel.json'
      - 'index.html'
      - '.github/workflows/**'

  pull_request:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect application changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          echo "Comparing:"
          echo "BASE: $BASE_SHA"
          echo "HEAD: $GITHUB_SHA"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -Eq \
            '^(src/|public/|package\.json$|package-lock\.json$|vite\.config\.ts$|tailwind\.config\.ts$|components\.json$|tsconfig\.json$|tsconfig\.app\.json$|tsconfig\.node\.json$|eslint\.config\.js$|\.prettierrc$|\.prettierignore$|vercel\.json$|index\.html$|\.github/workflows/)'; then
            echo "application_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "application_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.application_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.changes.outputs.application_changed == 'true'
        run: npm ci

      - name: Check lint
        if: steps.changes.outputs.application_changed == 'true'
        run: npm run lint
      
      - name: Check formatting
        if: steps.changes.outputs.application_changed == 'true'
        run: npm run format:check

      # - name: Run tests
      #   run: npm run test:run
      
      - name: Build project
        if: steps.changes.outputs.application_changed == 'true'
        run:  npm run build
      
      - name: Documentation-only change
        if: steps.changes.outputs.application_changed != 'true'
        run: echo "Documentation-only change. Project validation is not required."
      
      - name: Deploy to Vercel Preview
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/dev' &&
          steps.changes.outputs.application_changed == 'true'
        run: npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        if: |
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.changes.outputs.application_changed == 'true'
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}